[project]
name = "cag-estimator"
version = "0.5.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "litellm>=1.96.2",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "redis>=5.0,<8.0",
    "redisvl>=0.25",
    "scalar-fastapi>=1.8.2",
    "sse-starlette>=3.4.8",
    "streamlit>=1.61.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
